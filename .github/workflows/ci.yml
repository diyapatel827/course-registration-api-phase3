name: CI Quality Gate

on:
  push:
  pull_request:

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Lint
        run: flake8 main.py tests --max-line-length=150

      - name: Unit and API tests with coverage
        run: pytest -q --cov=main --cov-report=term-missing --cov-fail-under=80

      - name: Start API for integration tests
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health

      - name: Run live integration tests
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: pytest -q tests/test_live_integration.py

      - name: Stop API and show server logs
        if: always()
        run: |
          if [ -f api.pid ]; then kill "$(cat api.pid)" || true; fi
          if [ -f api.log ]; then cat api.log; fi
